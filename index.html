<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xaida AI</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

<div id="appShell">

  <header id="topBar">
    <div id="brandName">Xaida AI</div>
    <button id="modelSwitchButton" type="button">
      <span id="activeModelLabel">Xaida 2.1</span>
      <span class="chevron">&#9662;</span>
    </button>
    <div id="serverIndicator">
      <span id="serverDot"></span>
      <span id="serverStatusText">Connecting</span>
    </div>
  </header>

  <main id="chatPage" class="page page-visible">
    <div id="chatBox">
      <div id="emptyChatState">
        <h1>Ask Xaida anything</h1>
        <p>Research, coding, image scanning, math, assignments, and image generation.</p>
      </div>
    </div>

    <div id="composerBar">
      <label id="attachButton" for="imageAttachInput" title="Attach image">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </label>
      <input type="file" id="imageAttachInput" accept="image/*" hidden>
      <textarea id="messageInput" rows="1" placeholder="Type a message..."></textarea>
      <button id="sendButton" type="button" disabled>Send</button>
    </div>

    <div id="attachmentPreview" hidden>
      <img id="attachmentThumb" alt="Attached reference">
      <button id="removeAttachmentButton" type="button">Remove</button>
    </div>

    <footer id="creditLine">Created by : booz</footer>
  </main>

  <section id="modelPage" class="page">
    <div id="modelPageInner">
      <h2>Select a model</h2>

      <button class="model-card" type="button" data-model="xaida-2.1" data-available="true">
        <div class="model-card-head">
          <span class="model-name">Xaida 2.1</span>
          <span class="model-tag tag-ready">General</span>
        </div>
        <p class="model-desc">Great for research, coding, image scanning, math, assignments, and image generation.</p>
      </button>

      <button class="model-card" type="button" data-model="xaida-1.3" data-available="false">
        <div class="model-card-head">
          <span class="model-name">Xaida 1.3</span>
          <span class="model-tag tag-soon">Coming soon</span>
        </div>
        <p class="model-desc">Perfect for roleplay, consistent long term and short term memory, and stays in character. [It's not available yet, coming soon]</p>
      </button>

      <button id="closeModelPageButton" type="button">Back to chat</button>
    </div>
  </section>

</div>

<script src="serverConnector.js"></script>
<script src="messages.js"></script>
<script src="setup.js"></script>
</body>
</html>
