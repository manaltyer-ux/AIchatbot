<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GitHub Pages Remote Client</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #fff; padding: 20px; }
    #header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 15px; }
    #chat { border: 1px solid #334155; height: 360px; padding: 12px; overflow-y: auto; margin-bottom: 10px; border-radius: 8px; background: #1e293b; }
    input, button { padding: 10px; font-size: 14px; border-radius: 6px; }
    input { width: 320px; background: #0f172a; color: #fff; border: 1px solid #334155; }
    button { background: #2563eb; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .status { color: #38bdf8; font-style: italic; margin: 4px 0; font-size: 13px; }
    .error { color: #f87171; font-weight: bold; }
    .success { color: #4ade80; font-weight: bold; }
    .client-badge { font-size: 12px; background: #334155; padding: 4px 8px; border-radius: 4px; color: #38bdf8; font-family: monospace; }
  </style>
</head>
<body>

  <div id="header">
    <h2>GitHub Client</h2>
    <div class="client-badge" id="clientBadge">Client ID: Generating...</div>
  </div>
  
  <div>
    <label>Server Session ID:</label>
    <input type="text" id="targetSessionId" placeholder="Auto-Discovering Server...">
    <button id="connectBtn" disabled>Auto-Connecting...</button>
  </div>

  <br>
  <div id="chat"></div>

  <input type="text" id="msgInput" placeholder="Enter prompt...">
  <button id="sendBtn" disabled>Send Request</button>

  <script>
    // Generate unique Client ID
    const UNIQUE_CLIENT_ID = "client-" + Math.random().toString(36).substring(2, 8);
    document.getElementById("clientBadge").innerText = `Client ID: ${UNIQUE_CLIENT_ID}`;

    const chat = document.getElementById("chat");
    const targetSessionInput = document.getElementById("targetSessionId");
    const connectBtn = document.getElementById("connectBtn");
    const msgInput = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");

    let client = null;
    let activeServerId = "";
    let currentAiBubble = null;
    let activeRequestId = null;

    const DISCOVERY_TOPIC = "ai-chat-discovery-channel-v1";

    function logToChat(msg, className = "status") {
      const div = document.createElement("div");
      div.className = className;
      div.innerHTML = msg;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    // Connect to WebSocket Relay
    client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

    client.on('connect', () => {
      logToChat("Relay connected. Auto-discovering Host Server...", "status");
      // Subscribe to Auto-Discovery Channel
      client.subscribe(DISCOVERY_TOPIC);
    });

    client.on('message', (topic, message) => {
      try {
        const payload = JSON.parse(message.toString());

        // 1. Handle Auto-Discovery Packets
        if (topic === DISCOVERY_TOPIC) {
          if (payload && payload.sessionId && !activeServerId) {
            targetSessionInput.value = payload.sessionId;
            logToChat(`[Auto-Discovered Server] Found active Host: <b>${payload.sessionId}</b>`, "success");
            joinServerSession(payload.sessionId);
          }
          return;
        }

        // 2. Handle Private Client Responses
        if (payload.requestId && payload.requestId === activeRequestId) {
          if (payload.type === "QUEUED") {
            if (currentAiBubble) currentAiBubble.innerText = `AI: ${payload.text}`;
          }
          else if (payload.type === "PROCESSING") {
            if (currentAiBubble) currentAiBubble.innerText = "AI is generating...";
          }
          else if (payload.type === "CHUNK") {
            if (currentAiBubble) currentAiBubble.innerText = "AI: " + payload.text;
          } 
          else if (payload.type === "RESPONSE_COMPLETE") {
            // Replaces text with guaranteed full complete string
            if (currentAiBubble) currentAiBubble.innerText = "AI: " + payload.text;
            currentAiBubble = null;
            activeRequestId = null;
            sendBtn.disabled = false;
          }
          else if (payload.type === "ERROR") {
            if (currentAiBubble) currentAiBubble.innerText = "Error: " + payload.text;
            currentAiBubble = null;
            activeRequestId = null;
            sendBtn.disabled = false;
          }
        }
      } catch(e) { console.error("Error parsing response:", e); }
    });

    function joinServerSession(sessionId) {
      activeServerId = sessionId;
      const clientResponseTopic = `ai-chat/${sessionId}/response/${UNIQUE_CLIENT_ID}`;
      
      client.subscribe(clientResponseTopic, (err) => {
        if (!err) {
          logToChat(`Joined Dedicated Response Channel: <b>${clientResponseTopic}</b>`, "success");
          connectBtn.innerText = "Connected";
          sendBtn.disabled = false;
        } else {
          logToChat(`Failed to join response channel: ${err}`, "error");
        }
      });
    }

    connectBtn.addEventListener("click", () => {
      const manualId = targetSessionInput.value.trim();
      if (manualId) joinServerSession(manualId);
    });

    function sendPrompt() {
      const text = msgInput.value.trim();
      if (!text || !activeServerId) return;

      activeRequestId = "req-" + Date.now();
      logToChat(`<b>You:</b> ${text}`, "");
      
      currentAiBubble = document.createElement("div");
      currentAiBubble.style.color = "#4ade80";
      currentAiBubble.innerText = "AI: Requesting queue entry...";
      chat.appendChild(currentAiBubble);
      chat.scrollTop = chat.scrollHeight;

      const promptTopic = `ai-chat/${activeServerId}/prompt`;
      
      // Publish request targeting host server
      client.publish(promptTopic, JSON.stringify({
        clientId: UNIQUE_CLIENT_ID,
        text: text,
        requestId: activeRequestId
      }));
      
      msgInput.value = "";
      sendBtn.disabled = true;
    }

    sendBtn.addEventListener("click", sendPrompt);
    msgInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !sendBtn.disabled) sendPrompt();
    });
  </script>
</body>
</html>
