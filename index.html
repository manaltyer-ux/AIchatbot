<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GitHub Pages Remote Client</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #fff; padding: 20px; }
    #chat { border: 1px solid #334155; height: 350px; padding: 10px; overflow-y: auto; margin-bottom: 10px; border-radius: 8px; background: #1e293b; }
    input, button { padding: 10px; font-size: 14px; border-radius: 6px; }
    input { width: 320px; background: #0f172a; color: #fff; border: 1px solid #334155; }
    button { background: #2563eb; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .status { color: #38bdf8; font-style: italic; margin: 4px 0; }
    .error { color: #f87171; font-weight: bold; }
    .success { color: #4ade80; font-weight: bold; }
  </style>
</head>
<body>

  <h2>GitHub Pages Client</h2>
  
  <div>
    <label>Target Session ID:</label>
    <input type="text" id="targetSessionId" placeholder="e.g. ai-session-123456">
    <button id="connectBtn" disabled>Connecting Relay...</button>
  </div>

  <br>
  <div id="chat"></div>

  <input type="text" id="msgInput" placeholder="Enter prompt...">
  <button id="sendBtn" disabled>Send API Request</button>

  <script>
    const chat = document.getElementById("chat");
    const targetSessionInput = document.getElementById("targetSessionId");
    const connectBtn = document.getElementById("connectBtn");
    const msgInput = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");

    let client = null;
    let currentAiBubble = null;
    let currentSessionId = "";

    function logToChat(msg, className = "status") {
      const div = document.createElement("div");
      div.className = className;
      div.innerHTML = msg;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    // Connect to WebSocket Relay Server
    client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

    client.on('connect', () => {
      connectBtn.innerText = "Connect to Session";
      connectBtn.disabled = false;
      logToChat("Relay Network Connected. Ready to join session.", "status");
    });

    client.on('error', (err) => {
      logToChat(`Relay Connection Error: ${err}`, "error");
    });

    client.on('message', (topic, message) => {
      try {
        const data = JSON.parse(message.toString());
        if (data.type === "CHUNK") {
          if (currentAiBubble) currentAiBubble.innerText = "AI: " + data.text;
        } 
        else if (data.type === "RESPONSE_COMPLETE") {
          if (currentAiBubble) currentAiBubble.innerText = "AI: " + data.text;
          currentAiBubble = null;
          sendBtn.disabled = false;
        }
        else if (data.type === "ERROR") {
          if (currentAiBubble) currentAiBubble.innerText = "Error: " + data.text;
          currentAiBubble = null;
          sendBtn.disabled = false;
        }
      } catch(e) { console.error("Error parsing message:", e); }
    });

    connectBtn.addEventListener("click", () => {
      const targetId = targetSessionInput.value.trim();
      if (!targetId) return alert("Enter Target Session ID!");

      currentSessionId = targetId;

      const responseTopic = `ai-chat/${targetId}/response`;
      
      // Subscribe to AI responses
      client.subscribe(responseTopic, (err) => {
        if (!err) {
          logToChat(`Connected to Session: <b>${targetId}</b>`, "success");
          sendBtn.disabled = false;
        } else {
          logToChat(`Failed to join session: ${err}`, "error");
        }
      });
    });

    function sendPrompt() {
      const text = msgInput.value.trim();
      if (!text || !currentSessionId) return;

      logToChat(`<b>You:</b> ${text}`, "");
      
      currentAiBubble = document.createElement("div");
      currentAiBubble.style.color = "#4ade80";
      currentAiBubble.innerText = "AI is typing...";
      chat.appendChild(currentAiBubble);
      chat.scrollTop = chat.scrollHeight;

      const promptTopic = `ai-chat/${currentSessionId}/prompt`;
      
      // Publish prompt payload over WebSockets
      client.publish(promptTopic, JSON.stringify({ text: text }));
      
      msgInput.value = "";
      sendBtn.disabled = true;
    }

    sendBtn.addEventListener("click", sendPrompt);
    msgInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !sendBtn.disabled) sendPrompt();
    });
  </script>
</body>
</html>
