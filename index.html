<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GitHub Pages Remote Client</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #fff; padding: 20px; }
    #chat { border: 1px solid #334155; height: 350px; padding: 10px; overflow-y: auto; margin-bottom: 10px; border-radius: 8px; background: #1e293b; }
    input, button { padding: 10px; font-size: 14px; border-radius: 6px; }
    input { width: 300px; background: #0f172a; color: #fff; border: 1px solid #334155; }
    button { background: #2563eb; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .status { color: #38bdf8; font-style: italic; margin: 4px 0; }
    .error { color: #f87171; font-weight: bold; }
    .success { color: #4ade80; font-weight: bold; }
  </style>
</head>
<body>

  <h2>GitHub Pages Client</h2>
  
  <div>
    <label>Target Session ID:</label>
    <input type="text" id="targetSessionId" placeholder="e.g. ai-session-x9k2p1">
    <button id="connectBtn" disabled>Initializing...</button>
  </div>

  <br>
  <div id="chat"></div>

  <input type="text" id="msgInput" placeholder="Enter prompt...">
  <button id="sendBtn" disabled>Send API Request</button>

  <script>
    const chat = document.getElementById("chat");
    const targetSessionInput = document.getElementById("targetSessionId");
    const connectBtn = document.getElementById("connectBtn");
    const msgInput = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");

    let conn = null;
    let currentAiBubble = null;

    function logToChat(msg, className = "status") {
      const div = document.createElement("div");
      div.className = className;
      div.innerHTML = msg;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    // Include Google STUN servers to guarantee traversal through routers/firewalls
    const peer = new Peer({
      debug: 2,
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' }
        ]
      }
    });

    peer.on("open", (id) => {
      console.log("Client local peer ID:", id);
      connectBtn.innerText = "Connect to Session";
      connectBtn.disabled = false;
      logToChat("Client peer initialized. Ready to connect to host.", "status");
    });

    peer.on("error", (err) => {
      console.error("PeerJS Client Error:", err);
      logToChat(`Client Peer Error (${err.type}): ${err.message}`, "error");
      connectBtn.disabled = false;
      connectBtn.innerText = "Connect to Session";
    });

    connectBtn.addEventListener("click", () => {
      const targetId = targetSessionInput.value.trim();
      if (!targetId) return alert("Enter target Session ID!");

      if (!peer.id) {
        return alert("Client PeerJS is still connecting to the server. Please wait a second.");
      }

      logToChat(`Initiating connection to target: <b>${targetId}</b>...`);
      connectBtn.disabled = true;

      if (conn) conn.close();

      // Connect to host peer
      conn = peer.connect(targetId);

      // Handshake complete
      conn.on("open", () => {
        logToChat(`Connected to Session: ${targetId}`, "success");
        sendBtn.disabled = false;
        connectBtn.disabled = false;
        connectBtn.innerText = "Re-Connect";
      });

      conn.on("data", (data) => {
        if (data.type === "CHUNK") {
          if (currentAiBubble) currentAiBubble.innerText = "AI: " + data.text;
        } 
        else if (data.type === "RESPONSE_COMPLETE") {
          if (currentAiBubble) currentAiBubble.innerText = "AI: " + data.text;
          currentAiBubble = null;
          sendBtn.disabled = false;
        }
        else if (data.type === "ERROR") {
          if (currentAiBubble) currentAiBubble.innerText = "Error: " + data.text;
          currentAiBubble = null;
          sendBtn.disabled = false;
        }
      });

      conn.on("error", (err) => {
        logToChat(`Connection error: ${err}`, "error");
        sendBtn.disabled = true;
        connectBtn.disabled = false;
      });

      conn.on("close", () => {
        logToChat(`Disconnected from Host.`, "error");
        sendBtn.disabled = true;
        connectBtn.disabled = false;
      });
    });

    function sendPrompt() {
      const text = msgInput.value.trim();
      if (!text || !conn) return;

      logToChat(`<b>You:</b> ${text}`, "");
      
      currentAiBubble = document.createElement("div");
      currentAiBubble.style.color = "#4ade80";
      currentAiBubble.innerText = "AI is typing...";
      chat.appendChild(currentAiBubble);
      chat.scrollTop = chat.scrollHeight;

      conn.send({ type: "SEND_PROMPT", text: text });
      msgInput.value = "";
      sendBtn.disabled = true;
    }

    sendBtn.addEventListener("click", sendPrompt);
    msgInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !sendBtn.disabled) sendPrompt();
    });
  </script>
</body>
</html>
