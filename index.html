<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GitHub Pages Remote Client</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #fff; padding: 20px; }
    #header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 15px; }
    #chat { border: 1px solid #334155; height: 380px; padding: 12px; overflow-y: auto; margin-bottom: 10px; border-radius: 8px; background: #1e293b; }
    input, button { padding: 10px; font-size: 14px; border-radius: 6px; }
    input { width: 340px; background: #0f172a; color: #fff; border: 1px solid #334155; }
    button { background: #2563eb; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .status { color: #38bdf8; font-style: italic; margin: 4px 0; font-size: 13px; }
    .error { color: #f87171; font-weight: bold; }
    .success { color: #4ade80; font-weight: bold; }
    .client-badge { font-size: 12px; background: #334155; padding: 4px 8px; border-radius: 4px; color: #38bdf8; font-family: monospace; }
    #serverStatus { font-size: 12px; color: #94a3b8; font-style: italic; }
  </style>
</head>
<body>

  <div id="header">
    <h2>GitHub Client</h2>
    <div>
      <span id="serverStatus">Auto-Connecting...</span>
      <span class="client-badge" id="clientBadge">Client ID: Generating...</span>
    </div>
  </div>

  <div id="chat"></div>

  <input type="text" id="msgInput" placeholder="Enter prompt...">
  <button id="sendBtn" disabled>Send Request</button>

  <script>
    const UNIQUE_CLIENT_ID = "client-" + Math.random().toString(36).substring(2, 9);
    document.getElementById("clientBadge").innerText = `ID: ${UNIQUE_CLIENT_ID}`;

    const chat = document.getElementById("chat");
    const msgInput = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");
    const serverStatus = document.getElementById("serverStatus");

    let client = null;
    let activeServerId = "";
    let activeResponseTopic = "";
    let currentAiBubble = null;
    let activeRequestId = null;
    let watchdogTimer = null;

    const HEARTBEAT_TOPIC = "ai-chat/servers/heartbeat";
    const discoveredServers = {};

    function logToChat(msg, className = "status") {
      const div = document.createElement("div");
      div.className = className;
      div.innerHTML = msg;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function resetRollingWatchdog() {
      if (watchdogTimer) clearTimeout(watchdogTimer);
      watchdogTimer = setTimeout(() => {
        if (activeRequestId) {
          logToChat("Request stalled (No streaming activity received for 45s).", "error");
          if (currentAiBubble) currentAiBubble.innerText = "Error: Stream timeout.";
          clearWatchdog();
          sendBtn.disabled = false;
        }
      }, 45000);
    }

    function clearWatchdog() {
      if (watchdogTimer) clearTimeout(watchdogTimer);
      watchdogTimer = null;
      currentAiBubble = null;
      activeRequestId = null;
    }

    function autoSelectBestServer() {
      const now = Date.now();
      const healthyServers = [];
      let minQueue = 999;

      // Filter healthy active servers
      Object.keys(discoveredServers).forEach(sid => {
        const s = discoveredServers[sid];
        if (now - s.lastSeen < 6000) {
          if (s.queueLength < minQueue) {
            minQueue = s.queueLength;
          }
          healthyServers.push({ sid, queueLength: s.queueLength });
        }
      });

      // Find servers matching minimum queue length
      const bestCandidates = healthyServers.filter(s => s.queueLength === minQueue);

      if (bestCandidates.length > 0) {
        // If current server is healthy and optimal, keep it
        const currentIsOptimal = bestCandidates.some(c => c.sid === activeServerId);
        if (!currentIsOptimal) {
          // Randomly pick candidate to balance load evenly among tied servers
          const chosen = bestCandidates[Math.floor(Math.random() * bestCandidates.length)].sid;
          joinServerSession(chosen);
        }
      }
    }

    // Connect to WebSocket Broker with unique options
    client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
      clientId: UNIQUE_CLIENT_ID,
      clean: true,
      keepalive: 30
    });

    client.on('connect', () => {
      logToChat("Relay connected. Scanning background host servers...", "status");
      client.subscribe(HEARTBEAT_TOPIC);
    });

    client.on('message', (topic, message) => {
      try {
        const payload = JSON.parse(message.toString());

        if (topic === HEARTBEAT_TOPIC) {
          if (payload && payload.serverId) {
            discoveredServers[payload.serverId] = {
              queueLength: payload.queueLength,
              lastSeen: Date.now()
            };
            autoSelectBestServer();
          }
          return;
        }

        if (payload.requestId && payload.requestId === activeRequestId) {
          if (payload.type === "QUEUED") {
            resetRollingWatchdog();
            if (currentAiBubble) currentAiBubble.innerText = `AI: ${payload.text}`;
          }
          else if (payload.type === "PROCESSING") {
            resetRollingWatchdog();
            if (currentAiBubble) currentAiBubble.innerText = "AI is generating...";
          }
          else if (payload.type === "CHUNK") {
            resetRollingWatchdog();
            if (currentAiBubble) currentAiBubble.innerText = "AI: " + payload.text;
          } 
          else if (payload.type === "RESPONSE_COMPLETE") {
            if (currentAiBubble) currentAiBubble.innerText = "AI: " + payload.text;
            clearWatchdog();
            sendBtn.disabled = false;
          }
          else if (payload.type === "ERROR") {
            if (currentAiBubble) currentAiBubble.innerText = "Error: " + payload.text;
            clearWatchdog();
            sendBtn.disabled = false;
          }
        }
      } catch(e) { console.error("Error parsing response:", e); }
    });

    function joinServerSession(sessionId) {
      if (activeResponseTopic) {
        client.unsubscribe(activeResponseTopic);
      }

      activeServerId = sessionId;
      activeResponseTopic = `ai-chat/${sessionId}/response/${UNIQUE_CLIENT_ID}`;
      
      client.subscribe(activeResponseTopic, (err) => {
        if (!err) {
          serverStatus.innerHTML = `Connected Server: <b class="success">${sessionId}</b>`;
          sendBtn.disabled = false;
        }
      });
    }

    function sendPrompt() {
      const text = msgInput.value.trim();
      if (!text || !activeServerId) return;

      activeRequestId = "req-" + Date.now();
      logToChat(`<b>You:</b> ${text}`, "");
      
      currentAiBubble = document.createElement("div");
      currentAiBubble.style.color = "#4ade80";
      currentAiBubble.innerText = "AI: Sending request to server...";
      chat.appendChild(currentAiBubble);
      chat.scrollTop = chat.scrollHeight;

      const promptTopic = `ai-chat/${activeServerId}/prompt`;
      
      client.publish(promptTopic, JSON.stringify({
        clientId: UNIQUE_CLIENT_ID,
        text: text,
        requestId: activeRequestId
      }));
      
      msgInput.value = "";
      sendBtn.disabled = true;

      resetRollingWatchdog();
    }

    sendBtn.addEventListener("click", sendPrompt);
    msgInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !sendBtn.disabled) sendPrompt();
    });
  </script>
</body>
</html>
